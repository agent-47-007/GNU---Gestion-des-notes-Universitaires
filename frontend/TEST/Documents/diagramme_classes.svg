<svg width="1500" height="1300" viewBox="0 0 1500 1300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="1300" fill="#ffffff"/>
  <text x="750" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Diagramme de classes - Gestion des notes</text>

  <defs>
    <marker id="assoc-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ============ helper style constants (visual reference only) ============ -->
  <!-- Structural / organisational classes : indigo -->
  <!-- Pedagogical classes (UE, Matiere) : teal -->
  <!-- Actors (Etudiant, Enseignant) : coral -->
  <!-- Evaluation / suivi (Inscription, Note, Requete, Bulletin) : amber -->

  <!-- ================= LEFT SPINE : structure academique (composition) ================= -->

  <!-- Universite -->
  <g>
    <rect x="60" y="50" width="280" height="70" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
    <line x1="60" y1="80" x2="340" y2="80" stroke="#534ab7" stroke-width="1"/>
    <text x="200" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215c">Universite</text>
    <text x="72" y="97" font-size="11" fill="#3c3489">- Code_Univ</text>
    <text x="72" y="113" font-size="11" fill="#3c3489">- Nom_Univ</text>
  </g>

  <!-- Faculte -->
  <g>
    <rect x="60" y="160" width="280" height="70" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
    <line x1="60" y1="190" x2="340" y2="190" stroke="#534ab7" stroke-width="1"/>
    <text x="200" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215c">Faculte</text>
    <text x="72" y="207" font-size="11" fill="#3c3489">- Code_Fac</text>
    <text x="72" y="223" font-size="11" fill="#3c3489">- Nom_Fac</text>
  </g>

  <!-- Departement -->
  <g>
    <rect x="60" y="270" width="280" height="70" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
    <line x1="60" y1="300" x2="340" y2="300" stroke="#534ab7" stroke-width="1"/>
    <text x="200" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215c">Departement</text>
    <text x="72" y="317" font-size="11" fill="#3c3489">- Code_De</text>
    <text x="72" y="333" font-size="11" fill="#3c3489">- Nom_Depart</text>
  </g>

  <!-- Filiere -->
  <g>
    <rect x="60" y="380" width="280" height="70" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
    <line x1="60" y1="410" x2="340" y2="410" stroke="#534ab7" stroke-width="1"/>
    <text x="200" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215c">Filiere</text>
    <text x="72" y="427" font-size="11" fill="#3c3489">- Code_F</text>
    <text x="72" y="443" font-size="11" fill="#3c3489">- Nom_F</text>
  </g>

  <!-- Niveau -->
  <g>
    <rect x="60" y="490" width="280" height="90" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
    <line x1="60" y1="520" x2="340" y2="520" stroke="#534ab7" stroke-width="1"/>
    <text x="200" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215c">Niveau</text>
    <text x="72" y="537" font-size="11" fill="#3c3489">- Code_Niv</text>
    <text x="72" y="553" font-size="11" fill="#3c3489">- Cycle_Niv</text>
    <text x="72" y="569" font-size="11" fill="#3c3489">- Libelle_Niv</text>
  </g>

  <!-- Classe -->
  <g>
    <rect x="30" y="630" width="200" height="90" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1.2"/>
    <line x1="30" y1="660" x2="230" y2="660" stroke="#534ab7" stroke-width="1"/>
    <text x="130" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215c">Classe</text>
    <text x="42" y="677" font-size="11" fill="#3c3489">- Code_Classe</text>
    <text x="42" y="693" font-size="11" fill="#3c3489">- Effectif</text>
    <text x="42" y="709" font-size="11" fill="#3c3489">- Annee_Academique</text>
  </g>

  <!-- UE -->
  <g>
    <rect x="250" y="630" width="190" height="90" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
    <line x1="250" y1="660" x2="440" y2="660" stroke="#0f6e56" stroke-width="1"/>
    <text x="345" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">UE</text>
    <text x="262" y="677" font-size="11" fill="#0f6e56">- Code_UE</text>
    <text x="262" y="693" font-size="11" fill="#0f6e56">- Intitule_UE</text>
    <text x="262" y="709" font-size="11" fill="#0f6e56">- Avec_TP</text>
  </g>

  <!-- Matiere -->
  <g>
    <rect x="195" y="750" width="300" height="160" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.2"/>
    <line x1="195" y1="780" x2="495" y2="780" stroke="#0f6e56" stroke-width="1"/>
    <text x="345" y="770" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">Matiere</text>
    <text x="207" y="797" font-size="11" fill="#0f6e56">- Code_M</text>
    <text x="207" y="813" font-size="11" fill="#0f6e56">- Intitule</text>
    <text x="207" y="829" font-size="11" fill="#0f6e56">- Libelle_Matiere</text>
    <text x="207" y="845" font-size="11" fill="#0f6e56">- Coeff_CC</text>
    <text x="207" y="861" font-size="11" fill="#0f6e56">- Coeff_TP</text>
    <text x="207" y="877" font-size="11" fill="#0f6e56">- Coeff_SN</text>
  </g>

  <!-- Enseignant -->
  <g>
    <rect x="250" y="960" width="300" height="110" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="1.2"/>
    <line x1="250" y1="990" x2="550" y2="990" stroke="#993c1d" stroke-width="1"/>
    <text x="400" y="980" text-anchor="middle" font-size="13" font-weight="bold" fill="#712b13">Enseignant</text>
    <text x="262" y="1007" font-size="11" fill="#993c1d">- EID</text>
    <text x="262" y="1023" font-size="11" fill="#993c1d">- Nom_Enseignant</text>
    <text x="262" y="1039" font-size="11" fill="#993c1d">- Prenom_Enseignant</text>
    <text x="262" y="1055" font-size="11" fill="#993c1d">- Fonction_Enseignant</text>
  </g>

  <!-- ================= RIGHT COLUMN : etudiant + suivi pedagogique ================= -->

  <!-- Etudiant -->
  <g>
    <rect x="650" y="490" width="290" height="110" rx="6" fill="#faece7" stroke="#993c1d" stroke-width="1.2"/>
    <line x1="650" y1="520" x2="940" y2="520" stroke="#993c1d" stroke-width="1"/>
    <text x="795" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#712b13">Etudiant</text>
    <text x="662" y="537" font-size="11" fill="#993c1d">- Matricule</text>
    <text x="662" y="553" font-size="11" fill="#993c1d">- Nom</text>
    <text x="662" y="569" font-size="11" fill="#993c1d">- Prenom</text>
    <text x="662" y="585" font-size="11" fill="#993c1d">- Statut_Redoublant</text>
  </g>

  <!-- Inscription (classe association) -->
  <g>
    <rect x="650" y="660" width="290" height="70" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.2" stroke-dasharray="2,0"/>
    <line x1="650" y1="690" x2="940" y2="690" stroke="#854f0b" stroke-width="1"/>
    <text x="795" y="680" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">Inscription</text>
    <text x="662" y="707" font-size="11" fill="#854f0b">- Annee_Academique</text>
    <text x="662" y="722" font-size="9.5" font-style="italic" fill="#854f0b">(choix de matieres)</text>
  </g>

  <!-- Note -->
  <g>
    <rect x="650" y="790" width="290" height="100" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.2"/>
    <line x1="650" y1="820" x2="940" y2="820" stroke="#854f0b" stroke-width="1"/>
    <text x="795" y="810" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">Note</text>
    <text x="662" y="837" font-size="11" fill="#854f0b">- Code_Note</text>
    <text x="662" y="853" font-size="11" fill="#854f0b">- Type_Eval</text>
    <text x="662" y="869" font-size="11" fill="#854f0b">- Valeur_Note</text>
  </g>

  <!-- Requete -->
  <g>
    <rect x="650" y="950" width="290" height="100" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.2"/>
    <line x1="650" y1="980" x2="940" y2="980" stroke="#854f0b" stroke-width="1"/>
    <text x="795" y="970" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">Requete</text>
    <text x="662" y="997" font-size="11" fill="#854f0b">- Code_Re</text>
    <text x="662" y="1013" font-size="11" fill="#854f0b">- Objet_Re</text>
    <text x="662" y="1029" font-size="11" fill="#854f0b">- Libelle_Requete</text>
  </g>

  <!-- Bulletin -->
  <g>
    <rect x="650" y="1110" width="290" height="120" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.2"/>
    <line x1="650" y1="1140" x2="940" y2="1140" stroke="#854f0b" stroke-width="1"/>
    <text x="795" y="1130" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">Bulletin</text>
    <text x="662" y="1157" font-size="11" fill="#854f0b">- Code_Bulletin</text>
    <text x="662" y="1173" font-size="11" fill="#854f0b">- MGP_S1</text>
    <text x="662" y="1189" font-size="11" fill="#854f0b">- MGP_S2</text>
    <text x="662" y="1205" font-size="11" fill="#854f0b">- MGP_Total</text>
  </g>

  <!-- ================= RELATIONS ================= -->
  <g stroke="#444444" stroke-width="1" fill="none">
    <!-- composition chain (structure academique) -->
    <line x1="200" y1="120" x2="200" y2="160"/>
    <line x1="200" y1="230" x2="200" y2="270"/>
    <line x1="200" y1="340" x2="200" y2="380"/>
    <line x1="200" y1="450" x2="200" y2="490"/>
    <!-- Niveau branches to Classe and UE -->
    <path d="M200 580 L200 605 L130 605 L130 630"/>
    <path d="M200 580 L200 605 L345 605 L345 630"/>
    <!-- UE to Matiere -->
    <line x1="345" y1="720" x2="345" y2="750"/>
    <!-- Enseignant-Matiere -->
    <line x1="400" y1="960" x2="345" y2="910"/>
  </g>

  <!-- composition diamonds (filled, at the "whole" end) -->
  <g fill="#534ab7">
    <polygon points="200,120 208,128 200,136 192,128"/>
    <polygon points="200,230 208,238 200,246 192,238"/>
    <polygon points="200,340 208,348 200,356 192,348"/>
    <polygon points="200,450 208,458 200,466 192,458"/>
  </g>
  <g fill="#0f6e56">
    <polygon points="345,720 353,728 345,736 337,728"/>
  </g>

  <!-- cross-column associations -->
  <g stroke="#444444" stroke-width="1" fill="none">
    <!-- Etudiant-Faculte (appartient a) -->
    <line x1="650" y1="530" x2="340" y2="200"/>
    <!-- Etudiant-Niveau (inscrit dans) -->
    <line x1="650" y1="555" x2="340" y2="545"/>
    <!-- Etudiant-Inscription -->
    <line x1="795" y1="600" x2="795" y2="660"/>
    <!-- Note-Requete -->
    <line x1="795" y1="890" x2="795" y2="950"/>
    <!-- Matiere-Inscription -->
    <path d="M495 800 L620 800 L620 695 L650 695"/>
    <!-- Matiere-Note -->
    <path d="M495 830 L610 830 L610 840 L650 840"/>
    <!-- Etudiant-Note (lane) -->
    <path d="M650 560 L580 560 L580 835 L650 835"/>
    <!-- Etudiant-Requete (lane) -->
    <path d="M650 575 L600 575 L600 995 L650 995"/>
    <!-- Etudiant-Bulletin (lane) -->
    <path d="M650 588 L620 588 L620 1165 L650 1165"/>
  </g>

  <!-- multiplicities -->
  <g font-size="10.5" fill="#222222">
    <!-- structural chain -->
    <text x="208" y="135">1</text><text x="208" y="155">0..*</text>
    <text x="208" y="245">1</text><text x="208" y="265">0..*</text>
    <text x="208" y="355">1</text><text x="208" y="375">0..*</text>
    <text x="208" y="465">1</text><text x="208" y="485">0..*</text>
    <text x="140" y="625">0..*</text>
    <text x="355" y="625">1..*</text>
    <text x="353" y="745">1</text><text x="353" y="775">1..*</text>
    <text x="360" y="925" text-anchor="middle">0..*</text><text x="395" y="955">0..*</text>

    <!-- Etudiant-Faculte -->
    <text x="645" y="525">0..*</text><text x="346" y="200">1</text>
    <text x="500" y="345" text-anchor="middle" font-style="italic" font-size="10">appartient a</text>
    <!-- Etudiant-Niveau -->
    <text x="645" y="550">0..*</text><text x="346" y="545">1</text>
    <text x="500" y="540" text-anchor="middle" font-style="italic" font-size="10">est inscrit dans</text>
    <!-- Enseignant-Matiere -->
    <text x="405" y="940">0..*</text><text x="352" y="915">0..*</text>
    <text x="425" y="935" font-style="italic" font-size="10">dispense</text>
    <!-- Etudiant-Inscription -->
    <text x="800" y="615">1</text><text x="800" y="655">0..*</text>
    <!-- Matiere-Inscription -->
    <text x="500" y="795">1</text><text x="628" y="675">0..*</text>
    <!-- Matiere-Note -->
    <text x="500" y="825">1</text><text x="615" y="855">0..*</text>
    <!-- Etudiant-Note -->
    <text x="565" y="825">0..*</text>
    <!-- Note-Requete -->
    <text x="800" y="915">1</text><text x="800" y="945">0..*</text>
    <!-- Etudiant-Requete -->
    <text x="588" y="985">0..*</text>
    <!-- Etudiant-Bulletin -->
    <text x="608" y="1155">0..*</text>
    <text x="650" y="605" font-size="9.5" fill="#666666">(cote Etudiant = 1 pour Note, Requete, Bulletin)</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="1030" y="490" width="420" height="230" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="1050" y="515" font-size="13" font-weight="bold" fill="#1a1a1a">Legende</text>

    <polygon points="1055,535 1063,543 1055,551 1047,543" fill="#534ab7"/>
    <text x="1075" y="547" font-size="11" fill="#1a1a1a">Composition (structure academique)</text>

    <line x1="1047" y1="570" x2="1063" y2="570" stroke="#444444" stroke-width="1"/>
    <text x="1075" y="574" font-size="11" fill="#1a1a1a">Association simple, avec cardinalites</text>

    <rect x="1047" y="588" width="16" height="10" fill="#eeedfe" stroke="#534ab7"/>
    <text x="1075" y="597" font-size="11" fill="#1a1a1a">Structure academique (fac./dept./filiere/niveau)</text>

    <rect x="1047" y="611" width="16" height="10" fill="#e1f5ee" stroke="#0f6e56"/>
    <text x="1075" y="620" font-size="11" fill="#1a1a1a">Offre pedagogique (UE, matiere)</text>

    <rect x="1047" y="634" width="16" height="10" fill="#faece7" stroke="#993c1d"/>
    <text x="1075" y="643" font-size="11" fill="#1a1a1a">Acteurs (etudiant, enseignant)</text>

    <rect x="1047" y="657" width="16" height="10" fill="#faeeda" stroke="#854f0b"/>
    <text x="1075" y="666" font-size="11" fill="#1a1a1a">Suivi et evaluation (inscription, note, requete, bulletin)</text>

    <text x="1050" y="695" font-size="10" fill="#555555">Operations non representees : non specifiees</text>
    <text x="1050" y="710" font-size="10" fill="#555555">dans le recueil de besoin (a completer en conception).</text>
  </g>
</svg>
