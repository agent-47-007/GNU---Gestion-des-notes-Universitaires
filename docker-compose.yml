services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gnu_notes
      POSTGRES_USER: gnu
      POSTGRES_PASSWORD: gnu_dev
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./GNU_Creation_PostgreSQL.sql:/docker-entrypoint-initdb.d/001_creation.sql:ro
      - ./database/002_demo.sql:/docker-entrypoint-initdb.d/002_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnu -d gnu_notes"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gnu_notes
      DB_USER: gnu
      DB_PASSWORD: gnu_dev
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
